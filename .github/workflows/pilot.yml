name: ScrapPlanner application quality

on:
  push:
    branches: [main]
    paths: ['server/**', 'src/**', 'scripts/**', 'tests/**', 'expo/**', 'public/**', 'package*.json', '*.config.*', 'tsconfig*.json', 'index.html', 'render*.yaml', '.github/workflows/pilot.yml']
  pull_request:
    paths: ['server/**', 'src/**', 'scripts/**', 'tests/**', 'expo/**', 'public/**', 'package*.json', '*.config.*', 'tsconfig*.json', 'index.html', 'render*.yaml', '.github/workflows/pilot.yml']

permissions:
  contents: read

concurrency:
  group: application-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, Expo and server quality with PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: scrapplanner_test
          POSTGRES_USER: scrapplanner_test
          POSTGRES_PASSWORD: ci-test-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U scrapplanner_test -d scrapplanner_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      JEROC_TEST_DATABASE_URL: postgresql://scrapplanner_test:ci-test-only@127.0.0.1:5432/scrapplanner_test
      JEROC_TEST_POSTGRES_URL: postgresql://scrapplanner_test:ci-test-only@127.0.0.1:5432/scrapplanner_test
      EXPO_GO_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            expo/package-lock.json
      - run: npm ci --include=dev --no-audit --no-fund
      - run: npm --prefix expo ci --include=dev --no-audit --no-fund
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the AGI schema test validator
        run: python -m pip install lxml==6.0.2
      - run: npm run build
      - run: npm run expo:check
      - name: Require the isolated PostgreSQL service
        run: >-
          node --input-type=module -e
          "import pg from 'pg'; const pool = new pg.Pool({connectionString: process.env.JEROC_TEST_DATABASE_URL});
          try { await pool.query('SELECT 1'); } finally { await pool.end(); }"
      - name: Verify all server files, including PostgreSQL transaction paths
        run: node --test --test-concurrency=2 server/*.test.mjs

  browser:
    name: Isolated business workflow browser checks
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
      - run: npm ci --include=dev --no-audit --no-fund
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Verify customer, staff, settings and billing workflows
        run: >-
          npx playwright test
          tests/bokforing-demo.spec.ts
          tests/bokforing-suite.spec.ts
          tests/bokforing-invoice-pages.spec.ts
          tests/bokforing-purchase-pages.spec.ts
          tests/bokforing-documents.spec.ts
          tests/bokforing-wiki.spec.ts
          tests/bokforing-ande.spec.ts
          tests/bokforing-settlements.spec.ts
          tests/bokforing-payroll-workspace.spec.ts
          tests/bokforing-tax-rot.spec.ts
          tests/bokforing-commercial.spec.ts
          tests/bokforing-year-workspace.spec.ts
          tests/bokforing-cash-method.spec.ts
          tests/bokforing-fx.spec.ts
          tests/bokforing-sie.spec.ts
          tests/bokforing-payroll-completion.spec.ts
          tests/bokforing-rot-credit-completion.spec.ts
          tests/bokforing-declarations.spec.ts
          tests/company-register-entrypoints.spec.ts
          tests/customer-form.spec.ts
          tests/customer-intake.spec.ts
          tests/person-register-entrypoints.spec.ts
          tests/company-settings.spec.ts
          tests/delegated-user-management.spec.ts
          tests/platform-usage.spec.ts
          tests/transport-availability-recovery.spec.ts
          tests/shared-postgres.spec.ts
          tests/staff-invitations.spec.ts
          tests/mobile-systemadmin.spec.ts
          --workers=1
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
