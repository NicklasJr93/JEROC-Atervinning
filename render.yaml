services:
  - type: web
    name: jeroc-gardsapp-demo
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: npm ci --include=dev --no-audit --no-fund && npm run build:render
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "24.19.0"
